name = "hockeygamebot-site"
# nodejs_compat + a 2024-09-23+ compatibility_date are required by the Astro
# Cloudflare adapter's runtime for on-demand (SSR) routes. Static assets are
# unaffected; this only matters once a `prerender = false` route ships.
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"
