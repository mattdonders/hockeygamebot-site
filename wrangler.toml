name = "hockeygamebot-site"
# nodejs_compat + a 2024-09-23+ compatibility_date are required by the Astro
# Cloudflare adapter's runtime for on-demand (SSR) routes. Static assets are
# unaffected; this only matters once a `prerender = false` route ships.
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# PREVIEW-ONLY (see src/lib/passport-changelog-preview-fixture.ts): stands in
# for GET /v1/passport/changelog on Cloudflare Pages preview deployments,
# since hgb-api's changelog endpoint has no preview D1/R2 in this account yet.
# Astro auto-exposes any PUBLIC_-prefixed var to the client — no extra config.
# Scoped to Pages' built-in "preview" environment (every non-production-branch
# deployment), so it is structurally absent from the production build; no
# dashboard step needed. Delete once the real endpoint is preview-reachable.
[env.preview.vars]
PUBLIC_CHANGELOG_FIXTURE = "true"
